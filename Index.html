<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fd;color:#14233f}
:root{--navy:#062451;--blue:#1478ff;--sky:#eaf3ff;--green:#13b66b;--orange:#f5a623;--red:#e94c5f;--border:#e1e8f2}
.app{min-height:100vh}.top{height:66px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:21px;font-weight:900}.logoMark{width:38px;height:38px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-size:20px}
.layout{display:flex}.side{width:220px;background:#fff;min-height:calc(100vh - 66px);padding:16px 12px;border-right:1px solid var(--border)}.nav{padding:12px 14px;border-radius:11px;color:#637087;cursor:pointer;margin:4px 0}.nav.active,.nav:hover{background:var(--sky);color:var(--blue);font-weight:800}
.main{width:100%;max-width:1250px;padding:22px}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.welcome h1{margin:0 0 5px;font-size:25px}.muted{font-size:13px;color:#738096}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:13px;margin-top:13px}.card{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(10,35,75,.035)}.stat{font-size:28px;font-weight:900;margin-top:8px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.greenBtn{background:var(--green);color:white}.secondary{background:var(--sky);color:var(--blue)}.danger{background:#fff0f2;color:#d23e50}
.attBox{background:linear-gradient(135deg,#f4f9ff,#fff);border:1px solid #dfeaf8;border-radius:14px;padding:18px;display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:900}.present{background:#e7f9f0;color:#0c9b5a}.pending{background:#fff5dd;color:#9a7212}.rejected{background:#fff0f2;color:#d23e50}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--border);font-size:13px}th{color:#738096}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce4ef;border-radius:9px;background:white}.field textarea{min-height:80px}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef5ff,#fff)}.loginBox{width:min(410px,92%);background:white;border-radius:22px;padding:30px;box-shadow:0 18px 60px rgba(4,35,80,.13);border:1px solid var(--border)}.loginLogo{text-align:center;margin-bottom:20px}.loginLogo .logoMark{margin:auto;width:75px;height:75px;font-size:36px;border-radius:23px}.loginLogo h1{font-size:30px;margin:12px 0 3px}.loginLogo p{color:#718099;font-size:12px;margin:0}.error{color:var(--red);font-size:13px;margin-top:10px}
.tabs{display:flex;gap:7px;margin-bottom:16px}.tab{padding:9px 14px;border-radius:20px;background:#f0f3f8;color:#66738a;cursor:pointer;font-weight:700}.tab.on{background:var(--blue);color:white}
@media(max-width:850px){.side{width:64px}.nav{text-align:center}.nav .navLabel{display:none}.nav .navIcon{font-size:20px}.grid{grid-template-columns:1fr 1fr}.two,.form{grid-template-columns:1fr}.main{padding:14px}.welcome h1{font-size:21px}.top{padding:0 12px}}
</style></head><body><div id="root"></div>
<script>
let token=sessionStorage.getItem('o_token')||'',user=JSON.parse(sessionStorage.getItem('o_user')||'null');
const api=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
function fail(e){alert(e.message||e)}
function login(){api('login',uid.value,pw.value).then(x=>{token=x.token;user=x.user;sessionStorage.setItem('o_token',token);sessionStorage.setItem('o_user',JSON.stringify(user));render()}).catch(fail)}
function logout(){api('logout',token).finally(()=>{sessionStorage.clear();token='';user=null;renderLogin()})}
function nav(p){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));document.querySelector('[data-p="'+p+'"]')?.classList.add('active');({home,attendance,leave,profile,admin}[p]||home)()}
function renderLogin(){root.innerHTML=`<div class="login"><div class="loginBox"><div class="loginLogo"><div class="logoMark">✓</div><h1>OnTime <span style="color:#1478ff">HR</span></h1><p>Smart Attendance • Better Teams • A Stronger Tomorrow</p></div><div class="field"><label>User ID</label><input id="uid" placeholder="Enter User ID"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="pw" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Login</button><div class="muted" style="margin-top:15px;text-align:center">Contact your HR administrator for account access.</div></div></div>`}
function shell(){root.innerHTML=`<div class="app"><header class="top"><div class="logo"><div class="logoMark">✓</div>OnTime <span style="color:#1478ff">HR</span></div><div><b>${user.name}</b><span class="muted"> · ${user.id}</span></div></header><div class="layout"><aside class="side"><div class="nav active" data-p="home" onclick="nav('home')"><span class="navIcon">🏠</span> <span class="navLabel">Dashboard</span></div><div class="nav" data-p="attendance" onclick="nav('attendance')"><span class="navIcon">🕒</span> <span class="navLabel">Attendance</span></div><div class="nav" data-p="leave" onclick="nav('leave')"><span class="navIcon">📅</span> <span class="navLabel">Leave</span></div><div class="nav" data-p="profile" onclick="nav('profile')"><span class="navIcon">👤</span> <span class="navLabel">Profile</span></div>${user.role==='Admin'?'<div class="nav" data-p="admin" onclick="nav(\'admin\')"><span class="navIcon">⚙️</span> <span class="navLabel">Admin</span></div>':''}<div class="nav" onclick="logout()"><span class="navIcon">🚪</span> <span class="navLabel">Logout</span></div></aside><main class="main" id="main"></main></div></div>`;home()}
function home(){Promise.all([api('getTodayStatus',token),api('getMyAttendance',token)]).then(([t,a])=>{let present=a.filter(x=>x.status==='Present').length;main.innerHTML=`<div class="welcome"><div><h1>Welcome, ${user.name.split(' ')[0]} 👋</h1><div class="muted">${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}</div></div></div><div class="grid"><div class="card"><div class="muted">Today's Attendance</div><div class="stat">${t?'Present':'Not Marked'}</div></div><div class="card"><div class="muted">Present Days</div><div class="stat">${present}</div></div><div class="card"><div class="muted">Department</div><div class="stat" style="font-size:20px">${user.department||'—'}</div></div><div class="card"><div class="muted">Employee ID</div><div class="stat" style="font-size:20px">${user.id}</div></div></div><div class="two"><div class="card"><h3>Today's Attendance</h3><div class="attBox"><div><b>${t?'Attendance recorded':'Ready to check in'}</b><div class="muted">${t?`Check In: ${t.checkIn||'—'} · Check Out: ${t.checkOut||'—'}`:'Tap Check In to start your workday.'}</div></div><div class="actions">${!t?'<button class="btn greenBtn" onclick="mark(\'checkin\')">✓ Check In</button>':(!t.checkOut?'<button class="btn primary" onclick="mark(\'checkout\')">↪ Check Out</button>':'<span class="pill present">✓ Completed</span>')}</div></div></div><div class="card"><h3>Quick Actions</h3><div class="actions"><button class="btn secondary" onclick="nav('attendance')">Attendance History</button><button class="btn secondary" onclick="nav('leave')">Apply Leave</button></div></div></div>`}).catch(e=>{if((e.message||'').includes('Session'))renderLogin();else fail(e)})}
function mark(a){api('markAttendance',token,a).then(home).catch(fail)}
function attendance(){api('getMyAttendance',token).then(a=>{a.sort((x,y)=>y.date.localeCompare(x.date));main.innerHTML=`<div class="welcome"><div><h1>Attendance History</h1><div class="muted">Your attendance records</div></div><button class="btn primary" onclick="mark('checkin')">Check In</button></div><div class="card"><table><thead><tr><th>Date</th><th>Status</th><th>Check In</th><th>Check Out</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.date}</td><td><span class="pill present">${x.status}</span></td><td>${x.checkIn||'—'}</td><td>${x.checkOut||'—'}</td></tr>`).join('')}</tbody></table></div>`}).catch(fail)}
function leave(){Promise.all([api('myLeaves',token)]).then(([a])=>{main.innerHTML=`<div class="welcome"><div><h1>Leave Management</h1><div class="muted">Apply and track your leave</div></div></div><div class="card"><h3>Apply for Leave</h3><div class="form"><div class="field"><label>Leave Type</label><select id="lt"><option>Casual Leave</option><option>Sick Leave</option><option>Annual Leave</option><option>Other</option></select></div><div class="field"><label>From Date</label><input id="lf" type="date"></div><div class="field"><label>To Date</label><input id="lto" type="date"></div></div><div class="field"><label>Reason</label><textarea id="lr" placeholder="Enter reason"></textarea></div><button class="btn primary" onclick="applyL()">Submit Leave</button></div><div class="card"><h3>My Leaves</h3><table><thead><tr><th>From</th><th>To</th><th>Type</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td>${new Date(x.from).toLocaleDateString()}</td><td>${new Date(x.to).toLocaleDateString()}</td><td>${x.type}</td><td><span class="pill ${String(x.status).toLowerCase()}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`}).catch(fail)}
function applyL(){api('applyLeave',token,{type:lt.value,fromDate:lf.value,toDate:lto.value,reason:lr.value}).then(()=>{alert('Leave application submitted.');leave()}).catch(fail)}
function profile(){main.innerHTML=`<h1>My Profile</h1><div class="card" style="max-width:650px"><div class="form"><div><div class="muted">Name</div><b>${user.name}</b></div><div><div class="muted">Employee ID</div><b>${user.id}</b></div><div><div class="muted">Role</div><b>${user.role}</b></div><div><div class="muted">Department</div><b>${user.department||'—'}</b></div></div></div>`}
function admin(){Promise.all([api('listEmployees',token),api('getAllAttendance',token),api('leaveAdmin',token)]).then(([e,a,l])=>{main.innerHTML=`<div class="welcome"><div><h1>Admin Panel</h1><div class="muted">Manage employees, attendance and leave</div></div></div><div class="grid"><div class="card"><div class="muted">Employees</div><div class="stat">${e.filter(x=>x.status==='Active').length}</div></div><div class="card"><div class="muted">Attendance Records</div><div class="stat">${a.length}</div></div><div class="card"><div class="muted">Leave Requests</div><div class="stat">${l.filter(x=>x.status==='Pending').length}</div></div><div class="card"><div class="muted">System</div><div class="stat" style="font-size:20px">Online</div></div></div><div class="card"><h3>Create Employee</h3><div class="form"><div class="field"><label>Name</label><input id="en"></div><div class="field"><label>Employee ID</label><input id="ei" placeholder="EMP002"></div><div class="field"><label>Department</label><input id="ed"></div><div class="field"><label>Temporary Password</label><input id="ep"></div></div><button class="btn primary" onclick="createE()">+ Create Employee</button></div><div class="card"><h3>Employees</h3><table><thead><tr><th>Name</th><th>ID</th><th>Department</th><th>Status</th><th></th></tr></thead><tbody>${e.map(x=>`<tr><td>${x.name}</td><td>${x.id}</td><td>${x.department||'—'}</td><td>${x.status}</td><td>${x.id!=='ADMIN001'&&x.status==='Active'?`<button class="btn danger" onclick="deact('${x.id}')">Deactivate</button>`:''}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Recent Attendance</h3><table><thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Status</th></tr></thead><tbody>${a.sort((x,y)=>y.date.localeCompare(x.date)).slice(0,30).map(x=>`<tr><td>${x.date}</td><td>${x.employeeId}</td><td>${x.checkIn||'—'}</td><td>${x.checkOut||'—'}</td><td>${x.status}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Leave Requests</h3><table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Status</th><th>Action</th></tr></thead><tbody>${l.map(x=>`<tr><td>${x.employeeId}</td><td>${x.type}</td><td>${new Date(x.from).toLocaleDateString()} - ${new Date(x.to).toLocaleDateString()}</td><td>${x.status}</td><td>${x.status==='Pending'?`<button class="btn secondary" onclick="leaveDecision('${x.id}','Approved')">Approve</button> <button class="btn danger" onclick="leaveDecision('${x.id}','Rejected')">Reject</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}).catch(fail)}
function createE(){api('createEmployee',token,{name:en.value,id:ei.value,department:ed.value,password:ep.value}).then(admin).catch(fail)}
function deact(id){if(confirm('Deactivate '+id+'?'))api('deactivateEmployee',token,id).then(admin).catch(fail)}
function leaveDecision(id,s){api('updateLeave',token,id,s).then(admin).catch(fail)}
function render(){token&&user?shell():renderLogin()}render();
</script></body></html>
